# Configuração do servidor (sem senhas: este arquivo vai para o GitHub).
#
# As senhas ficam em config-local.properties, na pasta do projeto, que o Git ignora.
# Modelo: config-local.exemplo.properties
# No servidor online, dá para usar variáveis de ambiente no lugar:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, PORTELAS_ADMIN_SENHA
spring.config.import=optional:file:./config-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/marcenaria_portelas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

portelas.admin.usuario=admin
portelas.admin.senha=

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
